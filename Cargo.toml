[package]
name = "qemu_screen_grab_server"
version = "0.1.1"
edition = "2024"

[dependencies]
xsar = { path = "../xsar", default-features = false, features = ["tcp_capture"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.3", features = ["full"] }
winapi = { version = "0.3.9", features = ["winuser", "wingdi", "winerror"] }
ctrlc = "3.4"

[[bin]]
name = "qemu_screen_grab_server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
